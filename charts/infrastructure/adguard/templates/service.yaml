apiVersion: v1
kind: Service
metadata:
  name: adguard
  annotations:
    io.cilium/lb-ipam-ips: "{{ .Values.service.staticIP }}"
spec:
  type: LoadBalancer
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
    - name: web
      port: 80
      protocol: TCP